[package]
name = "urltoapp"
version = "1.0.0"
description = "Convert any website into a cross-platform desktop app — build Windows, macOS, and Linux native apps from any URL using Tauri"
authors = []
edition = "2021"

[lib]
name = "urltoapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
